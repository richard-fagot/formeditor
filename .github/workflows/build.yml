# Construit dist/index.html (fichier unique) sur GitHub et le met à disposition.
# Déclenchement : push sur main, ou manuellement (onglet Actions → « Construire index.html » → Run workflow).
# Publication sur GitHub Pages : seulement si la variable de dépôt DEPLOY_PAGES vaut « true » (voir docs/GITHUB.md).
name: Construire index.html

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Construction de dist/index.html
        run: npm run build

      - name: Kit développeurs
        run: npm run kit-dev

      - name: Artefact index.html
        uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: dist/index.html
          if-no-files-found: error

      - name: Artefact kit-dev
        uses: actions/upload-artifact@v4
        with:
          name: kit-dev
          path: kit-dev/
          if-no-files-found: error

      - name: Préparation GitHub Pages
        if: vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  pages:
    if: vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
